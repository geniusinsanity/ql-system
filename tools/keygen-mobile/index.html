<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QL System - مولد مفاتيح التفعيل</title>
    <meta name="theme-color" content="#1e40af">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 450px; padding: 25px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 25px; }
        .header .icon { font-size: 40px; margin-bottom: 8px; }
        .header h1 { font-size: 20px; font-weight: 700; color: #ffffff; }
        .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        input[type="text"] { width: 100%; background: #0f172a; border: 1.5px solid #475569; border-radius: 10px; padding: 14px; font-size: 16px; color: #ffffff; text-align: center; letter-spacing: 1px; font-weight: bold; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: #2563eb; color: #ffffff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #10b981; color: #ffffff; margin-top: 10px; }
        .btn-success:hover { background: #059669; }
        .btn-whatsapp { background: #22c55e; color: #ffffff; margin-top: 10px; text-decoration: none; }
        .btn-whatsapp:hover { background: #16a34a; }
        .result-box { display: none; margin-top: 25px; background: #091220; border: 1.5px dashed #3b82f6; border-radius: 12px; padding: 18px 15px; text-align: center; }
        .result-box.active { display: block; animation: fadeIn 0.3s ease; }
        .result-label { font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
        .key-text { font-size: 18px; font-weight: 800; color: #60a5fa; letter-spacing: 1px; word-break: break-all; margin-bottom: 12px; user-select: all; }
        .toast { display: none; margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; background: #064e3b; color: #6ee7b7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="icon">🔑</div>
            <h1>QL System - مولد التراخيص</h1>
            <p>خاص بالمطور فقط (توليد مفتاح تفعيل الزبون)</p>
        </div>

        <div class="form-group">
            <label for="machineId">كود جهاز الزبون (Machine ID):</label>
            <input type="text" id="machineId" placeholder="مثال: QL-ALG-7410-9921-X9A2" autocomplete="off" spellcheck="false">
        </div>

        <button class="btn btn-primary" onclick="generateKey()">⚡ توليد مفتاح التفعيل الدائم</button>

        <div class="result-box" id="resultBox">
            <div class="result-label">مفتاح التفعيل (Licence Permanente):</div>
            <div class="key-text" id="keyOutput">ACT-XXXX-XXXX-XXXX-XXXX</div>

            <button class="btn btn-success" onclick="copyKey()">📋 نسخ المفتاح إلى الحافظة</button>
            <a id="whatsappBtn" class="btn btn-whatsapp" target="_blank">💬 إرسال المفتاح عبر واتساب</a>
        </div>

        <div id="toast" class="toast">تم نسخ المفتاح بنجاح!</div>
    </div>

    <script>
        const DEVELOPER_SECRET = "QL_SECRET_DEVELOPER_KEY_ALGERIA_QUINCAILLERIE_2026_X99";

        async function generateKey() {
            const input = document.getElementById('machineId').value.trim().toUpperCase();
            if (!input) {
                alert("يرجى إدخال كود الجهاز أولاً!");
                return;
            }

            const enc = new TextEncoder();
            const key = await crypto.subtle.importKey(
                "raw",
                enc.encode(DEVELOPER_SECRET),
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );

            const signature = await crypto.subtle.sign("HMAC", key, enc.encode(input));
            const hashArray = Array.from(new Uint8Array(signature));
            const hex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();

            const p1 = hex.substring(0, 4);
            const p2 = hex.substring(4, 8);
            const p3 = hex.substring(8, 12);
            const p4 = hex.substring(12, 16);

            const activationKey = `ACT-${p1}-${p2}-${p3}-${p4}`;

            document.getElementById('keyOutput').innerText = activationKey;
            document.getElementById('resultBox').classList.add('active');

            const waMsg = encodeURIComponent(
                `السلام عليكم،\nشكراً لشرائك برنامج QL System للكانكري.\n\nكود جهازك: ${input}\nمفتاح التفعيل الدائم الخاص بك:\n${activationKey}\n\nبالتوفيق في عملك!`
            );
            document.getElementById('whatsappBtn').href = `https://wa.me/?text=${waMsg}`;
        }

        function copyKey() {
            const key = document.getElementById('keyOutput').innerText;
            navigator.clipboard.writeText(key).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 2500);
            });
        }
    </script>
</body>
</html>
