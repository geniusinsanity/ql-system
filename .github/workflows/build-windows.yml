name: Build QL System for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore QLSystem.sln

    - name: Build Solution
      run: dotnet build QLSystem.sln -c Release --no-restore

    - name: Publish Windows App (Portable x64)
      run: |
        dotnet publish src/QLSystem.App/QLSystem.App.csproj -c Release -r win-x64 --self-contained false -o ./output/QLSystem-App
        dotnet publish src/QLSystem.KeyGen/QLSystem.KeyGen.csproj -c Release -r win-x64 --self-contained false -o ./output/QLSystem-KeyGen

    - name: Create Zip Package for Windows
      run: |
        Compress-Archive -Path ./output/QLSystem-App/* -DestinationPath ./output/QLSystem-Windows-x64.zip
        Compress-Archive -Path ./output/QLSystem-KeyGen/* -DestinationPath ./output/KeyGen-Windows.zip

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QLSystem-Windows-x64
        path: ./output/QLSystem-Windows-x64.zip

    - name: Upload KeyGen Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeyGen-Windows
        path: ./output/KeyGen-Windows.zip
